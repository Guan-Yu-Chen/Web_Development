<script>
    $("iframe, audio").remove();
    
    $("ol li").text(function (_, t){
        return t + " (Acquired by Facebook)";
    });
    
    $("ol li").wrap("<a href='https://www.google.com/'></a>");

    $("th").css("border", "1px dashed");

    $("body img").hover(function () {
        $("a img").toggle()
    });

    $("td").each(function() {
        if($(this).text() == "1") {
            $(this).css("background-color", "lightblue");
        }
    });

    $("body img").click(function() {
        const temp = $("<p>");
        const a = $("a").eq(1);
        const b = $("a").eq(2);
        
        a.before(temp);
        b.after(a);
        temp.replaceWith(b);

        const h = $(this).css("height");
        const w = $(this).css("width");
        $(this).animate({"height": "600px"}, 300);
        $(this).animate({"width": "600px"}, 300);
        $(this).animate({"height": h}, 300);
        $(this).animate({"width": w}, 300);
    });


            
</script>
