<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal - Personal Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/personal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="close-sidebar" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="personal.html" class="active"><i class="fa-solid fa-grip"></i> Personal</a></li>
                <li><a href="weather.html"><i class="fa-solid fa-cloud-sun"></i> Weather</a></li>
                <li><a href="schedule.html"><i class="fa-solid fa-calendar-days"></i> Schedule</a></li>
                <li><a href="parking.html"><i class="fa-solid fa-square-parking"></i> Parking</a></li>
                <li><a href="food.html"><i class="fa-solid fa-utensils"></i> Food Map</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <button id="open-sidebar" class="icon-btn"><i class="fa-solid fa-bars"></i></button>
                <div class="page-title">
                    <h2>Personal Dashboard</h2>
                </div>
                <div class="date-time">
                    <span id="clock">00:00</span>
                </div>
            </header>

            <div class="personal-container">
                <div class="canvas-area transition-all" id="canvas-area">
                    <div class="grid-background" id="grid-background">
                        <!-- Crosses will be generated here or via CSS -->
                        <div class="grid-overlay" id="grid-overlay">
                            <!-- Grid cells will be placed here -->
                        </div>
                        <div class="widgets-layer" id="widgets-layer">
                            <!-- Widgets will be placed here -->
                        </div>
                    </div>
                </div>

                <div class="toolbox-panel transition-all" id="toolbox-panel">
                    <button class="toggle-toolbox-btn" id="toggle-toolbox-btn">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>

                    <div class="toolbox-content">
                        <!-- Category Selectors (1x6) -->
                        <div class="toolbox-categories">
                            <button class="cat-btn active" data-cat="calendar"><i
                                    class="fa-solid fa-clock"></i></button>
                            <button class="cat-btn" data-cat="weather"><i class="fa-solid fa-cloud-sun"></i></button>
                            <button class="cat-btn" data-cat="schedule"><i
                                    class="fa-solid fa-calendar-days"></i></button>
                            <button class="cat-btn" data-cat="parking"><i
                                    class="fa-solid fa-square-parking"></i></button>
                            <button class="cat-btn" data-cat="photo"><i class="fa-regular fa-image"></i></button>
                        </div>

                        <div class="toolbox-body">
                            <h3 id="toolbox-title">Date & Time</h3>
                            <div class="widget-list" id="widget-list">
                                <!-- Dynamic Widget List -->
                            </div>
                        </div>

                        <!-- Trash Zone -->
                        <div class="trash-zone" id="trash-zone">
                            <i class="fa-solid fa-trash"></i>
                            <span>Drag to delete</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/script.js"></script>
    <script src="js/personal.js"></script>
</body>

</html>
