<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Personal Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/schedulestyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>

    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar (Same as other pages) -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="close-sidebar" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="personal.html"><i class="fa-solid fa-grip"></i> Personal</a></li>
                <li><a href="weather.html"><i class="fa-solid fa-cloud-sun"></i> Weather</a></li>
                <li><a href="schedule.html" class="active"><i class="fa-solid fa-calendar-days"></i> Schedule</a></li>
                <li><a href="parking.html"><i class="fa-solid fa-square-parking"></i> Parking</a></li>
                <li><a href="food.html"><i class="fa-solid fa-utensils"></i> Food Map</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <button id="open-sidebar" class="icon-btn"><i class="fa-solid fa-bars"></i></button>
                <div class="page-title">
                    <h2>Weekly Schedule</h2>
                </div>

                <div class="control-buttons" style="display: flex; gap: 10px;">
                    <button id="open-json-btn" class="btn btn-primary" title="開啟本地 events.json 檔案 (Chrome/Edge Only)"><i
                            class="fa-solid fa-folder-open"></i> 開啟資料檔</button>
                    <button id="save-json-btn" class="btn btn-success" title="寫回 events.json" style="display:none;"><i
                            class="fa-solid fa-floppy-disk"></i> 儲存變更</button>
                    <button id="download-json-backup-btn" class="btn btn-secondary" title="下載 JSON 備份"><i
                            class="fa-solid fa-download"></i> 下載備份</button>
                    <button id="reset-data-btn" class="btn btn-secondary" title="清除所有本地儲存的數據"><i
                            class="fa-solid fa-trash"></i> 清除暫存</button>
                </div>
                <!-- Removed CSV file input -->

                <div class="date-time">
                    <span id="clock">00:00</span>
                </div>
            </header>

            <div class="date-controller" style="width: 100%;">
                <table style="width: 100%;" id="date-controller">
                    <tr>
                        <td style="width: 20%; text-align: center;">
                            <button class="btn-w" id="btn-lw" title="Last Week">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>
                        </td>
                        <td style="width: 20%; text-align: center;"></td>
                        <td style="width: 20%; text-align: center;" id="title-w">
                            <h2>12/01 - 12/07</h2>
                        </td>
                        <td style="width: 20%; text-align: center;"></td>
                        <td style="width: 20%; text-align: center;">
                            <button class="btn-w" id="btn-nw" title="Next Week">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </td>
                    </tr>
                </table>
            </div>

            <div class="schedule-container">
                <div class="calendar-view">
                    <div class="calendar-header">
                        <div class="header-cell">Time</div>
                        <div class="header-cell" id="day0">Sun</div>
                        <div class="header-cell" id="day1">Mon</div>
                        <div class="header-cell" id="day2">Tue</div>
                        <div class="header-cell" id="day3">Wed</div>
                        <div class="header-cell" id="day4">Thu</div>
                        <div class="header-cell" id="day5">Fri</div>
                        <div class="header-cell" id="day6">Sat</div>
                    </div>
                    <div class="calendar-body" id="calendar-body">
                        <div class="time-column">
                            <!-- Generated by JS -->
                        </div>
                        <!-- Day columns generated by JS -->
                    </div>
                </div>

                <div class="sidebar-panel">
                    <button class="add-btn" id="open-modal">
                        <i class="fa-solid fa-plus"></i> New Event
                    </button>
                    <div class="event-detail" id="event-detail-id">
                        <h3>Event Detail</h3>


                        <form id="event-detail-sideform">
                            <div class="form-group-detail-sideform">
                                <!-- <label>Event Name</label> -->
                                <input type="text" class="form-control" id="event-name-detail" required>
                            </div>
                            <div class="form-group-detail-sideform">
                                <label>Date</label>
                                <input type="date" class="form-control" id="event-day-detail" min="2024-01-01"
                                    max="2026-12-31">
                            </div>
                            <div class="form-group-sideform" style="display: flex; gap: 10px;">
                                <div style="flex: 1;">
                                    <label>Start Time</label>
                                    <input type="time" class="form-control" id="event-start-detail" required>
                                </div>
                                <div style="flex: 1;">
                                    <label>End Time</label>
                                    <input type="time" class="form-control" id="event-end-detail" required>
                                </div>
                            </div>
                            <div class="form-group-sideform">
                                <label>Note</label>
                                <textarea class="form-control" id="event-note-detail" rows="3"></textarea>
                            </div>
                            <div class="form-group-sideform">
                                <label>Color</label>
                                <div class="color-options-detail" id="color-picker-detail">
                                    <div class="color-option-detail selected" style="background-color: #38bdf8;"
                                        data-color="#38bdf8">
                                    </div>
                                    <div class="color-option-detail" style="background-color: #fbbf24;"
                                        data-color="#fbbf24"></div>
                                    <div class="color-option-detail" style="background-color: #f87171;"
                                        data-color="#f87171"></div>
                                    <div class="color-option-detail" style="background-color: #4ade80;"
                                        data-color="#4ade80"></div>
                                    <div class="color-option-detail" style="background-color: #a78bfa;"
                                        data-color="#a78bfa"></div>
                                </div>
                            </div>
                            <div class="modal-actions">
                                <button type="button" class="btn btn-secondary" id="delete-detail">Delete</button>
                                <button type="button" class="btn btn-secondary" id="close-detail">Cancel</button>
                                <button type="submit" class="btn btn-primary">Fix Event</button>
                            </div>
                        </form>


                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal" id="event-modal">
        <div class="modal-content">
            <h3>Add New Event</h3>
            <form id="event-form">
                <div class="form-group">
                    <label>Event Name</label>
                    <input type="text" class="form-control" id="event-name" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" class="form-control" id="event-day" min="2024-01-01" max="2026-12-31">
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Start Time</label>
                        <input type="time" class="form-control" id="event-start" required>
                    </div>
                    <div style="flex: 1;">
                        <label>End Time</label>
                        <input type="time" class="form-control" id="event-end" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Note</label>
                    <textarea class="form-control" id="event-note" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <div class="color-options" id="color-picker">
                        <div class="color-option selected" style="background-color: #38bdf8;" data-color="#38bdf8">
                        </div>
                        <div class="color-option" style="background-color: #fbbf24;" data-color="#fbbf24"></div>
                        <div class="color-option" style="background-color: #f87171;" data-color="#f87171"></div>
                        <div class="color-option" style="background-color: #4ade80;" data-color="#4ade80"></div>
                        <div class="color-option" style="background-color: #a78bfa;" data-color="#a78bfa"></div>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="close-modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Event</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>

    <script src="js/schedule.js"></script>
</body>

</html>
