<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Map - Personal Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/foodstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>

    </style>
</head>

<body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="close-sidebar" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="personal.html"><i class="fa-solid fa-grip"></i> Personal</a></li>
                <li><a href="weather.html"><i class="fa-solid fa-cloud-sun"></i> Weather</a></li>
                <li><a href="schedule.html"><i class="fa-solid fa-calendar-days"></i> Schedule</a></li>
                <li><a href="parking.html"><i class="fa-solid fa-square-parking"></i> Parking</a></li>
                <li><a href="food.html" class="active"><i class="fa-solid fa-utensils"></i> Food Map</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <button id="open-sidebar" class="icon-btn"><i class="fa-solid fa-bars"></i></button>
                <div class="page-title">
                    <h2>Food Map</h2>
                </div>
                <div class="date-time">
                    <span id="clock">00:00</span>
                </div>
            </header>

            <div class="control-buttons" style="margin: 20px 0px; display: flex; gap: 10px;">
                <button id="open-json-btn" class="btn btn-primary"
                    title="開啟本地 restaurants.json 檔案 (Chrome/Edge Only)"><i class="fa-solid fa-folder-open"></i>
                    開啟資料檔</button>
                <button id="save-json-btn" class="btn btn-success" title="寫回 restaurants.json" style="display:none;"><i
                        class="fa-solid fa-floppy-disk"></i> 儲存變更</button>
                <button id="download-json-backup-btn" class="btn btn-secondary" title="下載 JSON 備份"><i
                        class="fa-solid fa-download"></i> 下載備份</button>
                <button id="reset-data-btn" class="btn btn-danger" title="清除所有本地儲存的數據"><i class="fa-solid fa-trash"></i>
                    清除暫存</button>
            </div>
            <!-- Removed CSV file input -->

            <div class="food-container">
                <div class="left-panel">
                    <!-- Add/Edit Form -->
                    <div class="panel-card">
                        <div class="panel-title">
                            <span id="form-title">Add Restaurant</span>
                            <button class="action-btn" id="reset-form" title="Clear Form"><i
                                    class="fa-solid fa-rotate-left"></i></button>
                        </div>
                        <form id="restaurant-form">
                            <input type="hidden" id="edit-id">
                            <div class="form-grid">
                                <div class="form-group">
                                    <input type="text" class="form-control" id="res-name" placeholder="Name (Required)"
                                        required>
                                </div>
                                <div class="form-group">
                                    <input type="number" class="form-control" id="res-rating"
                                        placeholder="Rating (0-10)" min="0" max="10" step="0.1">
                                </div>
                                <div class="form-group">
                                    <input type="text" class="form-control" id="res-tags"
                                        placeholder="Tags (comma separated)">
                                </div>
                                <div class="form-group">
                                    <input type="text" class="form-control" id="res-distance"
                                        placeholder="Distance (e.g. 10 min)">
                                </div>
                                <div class="form-group full-width">
                                    <input type="text" class="form-control" id="res-website"
                                        placeholder="Website / Menu URL">
                                </div>
                                <div class="form-group full-width">
                                    <input type="text" class="form-control" id="res-note" placeholder="Note">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Save Restaurant</button>
                        </form>
                    </div>

                    <!-- List & Search -->
                    <div class="panel-card" style="flex: 1; overflow: hidden;">
                        <div class="panel-title">
                            <span>Restaurants</span>
                            <div style="display: flex; gap: 10px;">
                                <input type="text" class="form-control" id="search-input-tag"
                                    placeholder="Search by tag..." style="width: 150px; padding: 5px;">
                                <input type="text" class="form-control" id="search-input-name"
                                    placeholder="Search by name..." style="width: 150px; padding: 5px;">
                            </div>
                        </div>
                        <div class="restaurant-list" id="restaurant-list">
                            <!-- Items injected here -->
                        </div>
                    </div>
                </div>

                <div class="right-panel">
                    <!-- Random Picker -->
                    <div class="panel-card">
                        <div class="panel-title">What to eat?</div>
                        <div class="form-group">
                            <input type="text" class="form-control" id="picker-tag"
                                placeholder="Filter by tag (optional)">
                        </div>
                        <button class="btn btn-primary" id="pick-btn" style="width: 100%;">Pick Random</button>
                        <div class="picker-result" id="picker-result">
                            <span style="color: var(--text-secondary);">Result will appear here</span>
                        </div>
                    </div>

                    <!--TagDictionary-->
                    <div class="panel-card">
                        <div class="panel-title">To Consult Exist Tags</div>
                        <button class="btn" id="btn-consult">Click to Consult</button>
                    </div>

                    <!-- Memo -->
                    <div class="panel-card" style="flex: 1;">
                        <div class="panel-title">To Explore / Memo</div>
                        <textarea class="memo-area" id="memo-area"
                            placeholder="Write down restaurants to try..."></textarea>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/script.js"></script>
    <script src="js/food.js"></script>
</body>

</html>
