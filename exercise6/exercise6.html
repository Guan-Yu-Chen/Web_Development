<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            width: 180px;
            height: 60px;
            background-color: lightblue;
            border: none
        }

        button:hover {
            background-color: blue;
            color: white;
        }

        button:hover ~ div.logo, button:hover ~ div img {
            animation-direction: reverse;
        }

        div.main {
            width: 600px;
            height: 400px;
            position: relative;
            left: 50px;
            border: 1px solid black;
        }

        div.logo {
            position: relative;
            width: 50px;
            height: 50px;
            animation: move-clockwise 8s linear infinite;
            z-index: -1;
        }

        img {
            width: 100%;
            height: 100%;
            animation: self-rotate 2s linear infinite;
        }

        @keyframes move-clockwise {
            0% {
                top: 0;
                left: 0;
            }
            30% {
                top: 0;
                left: 650px;
            }
            50% {
                top: 450px;
                left: 650px;
            }
            80% {
                top: 450px;
                left: 0;
            }
            100% {
                top: 0px;
                left: 0px;
            }
        }   

        @keyframes self-rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <button id="b1">Ask My Name</button>
    <button id="b2">Run Faster!</button>
    <button id="b3">Another Logo</button>
    <div class="logo">
        <img src="Media/ncku-logo1.jpg">
    </div>
    <div class="main"></div>
</body>
<script>
    let mainDiv = document.querySelector("div.main");
    let logoDiv = document.querySelector("div.logo");
    let imgElement = document.querySelector("div.logo img");
    
    document.getElementById("b1").onclick = function() {
        let name = prompt("What's your name?");
        mainDiv.innerHTML = "Howdy! " + name;
    }

    let flag1 = 1;
    document.getElementById("b2").onclick = function() {
        if (flag1 == 1) {
            logoDiv.style.animationDuration = "4s";
            imgElement.style.animationDuration = "1s";
            flag1 = 0;
        }
        else {
            logoDiv.style.animationDuration = "8s";
            imgElement.style.animationDuration = "2s";
            flag1 = 1;
        }
    }

    let flag2 = 1;
    document.getElementById("b3").onclick = function() {
        if (flag2 == 1) {
            imgElement.src = "Media/ncku-logo2.jpg";
            flag2 = 0;
        }
        else {
            imgElement.src = "Media/ncku-logo1.jpg";
            flag2 = 1;
        }
    }
</script>
</html>
